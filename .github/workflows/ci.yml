name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Astro 7 needs Node 22.23.4 or newer; Vitest's V8 coverage also needs Node, and
      # `bun run` hands the tool binaries to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      # Typecheck builds the library first; lint resolves astro-eclipse/client from dist.
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test with coverage
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/astro-eclipse/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build (library, size-limit budgets)
        run: bun run build
      - name: Check the package (publint, type resolution)
        run: bun run lint:package
      - name: Install the packed tarball and render from it
        run: bun run test:pack
      - name: Build the demo
        run: bun run --filter example build
      - name: End-to-end tests of the demo app
        run: |
          bunx playwright install --with-deps chromium firefox webkit
          bun run --filter example test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/example/test-results/
          retention-days: 7
      - name: Build docs
        run: bun run --filter docs build

  # The library declares astro ^5.0.0 || ^6.0.0 || ^7.0.0, so it is tested against the
  # oldest version in the first range, the newest of the second, and the newest on npm.
  astro-versions:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['5.0.0', '6', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install with astro@${{ matrix.astro }}
        run: |
          npm pkg set overrides.astro=${{ matrix.astro }}
          bun install
      - name: Check the installed version
        working-directory: packages/astro-eclipse
        env:
          EXPECTED: ${{ matrix.astro }}
        run: |
          actual=$(node -p "require('astro/package.json').version")
          echo "astro $actual"
          if [ "$EXPECTED" != latest ]; then
            case "$actual" in
              "$EXPECTED" | "$EXPECTED".*) ;;
              *) echo "Expected astro $EXPECTED" >&2; exit 1 ;;
            esac
          fi
      - name: Typecheck the library
        run: bun run --filter astro-eclipse typecheck
      - name: Unit tests
        run: bun run test
      - name: Build the library for the package check
        run: bun run build
      - name: Install the packed tarball and build a site with it
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
        run: bun run test:pack

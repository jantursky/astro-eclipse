name: Feature request
description: An idea for the API, the transitions or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The site or workflow you have in mind, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: An API sketch, or a transition described in the terms the library already uses, helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
